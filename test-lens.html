<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inversion Lens Showcase Test</title>
  <script>
    window.addEventListener('error', function(e) {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:10px;left:10px;background:red;color:white;padding:12px;z-index:99999;max-width:90vw;font-size:14px;';
      d.textContent = 'JS ERROR: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')';
      document.body.appendChild(d);
    });
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "/js/vendor/three.module.js"
    }
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #1A0B17;
      color: #F2E9ED;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
      color: #C89BB2;
      font-weight: 300;
    }
    .poster-container {
      width: 380px;
      aspect-ratio: 3 / 4.4;
      position: relative;
      border: 1px solid rgba(200, 155, 178, 0.4);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      cursor: crosshair;
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(200, 155, 178, 0.7);
    }
  </style>
</head>
<body>
  <h1>Daydreamers Fluid Inversion Lens</h1>
  <div class="poster-container" id="lensBox">
    <img src="/assets/showcase-poster.jpg" alt="Featured Poster" style="display: none;" />
  </div>
  <div class="hint">Move cursor or drag over the poster to swirl the chemical film emulsion</div>

  <script type="module">
    import { InversionLens } from '/js/modules/three/inversion-lens.js';

    const img = document.querySelector('#lensBox img');
    function start() {
      const box = document.getElementById('lensBox');
      const lens = new InversionLens(box, {
        maskRadius: 0.38,
        turbulenceIntensity: 0.24,
        maskSpeed: 0.8
      });
      window.testLens = lens;
    }

    if (img.complete && img.naturalWidth > 0) {
      start();
    } else {
      img.addEventListener('load', start);
    }
  </script>
</body>
</html>
