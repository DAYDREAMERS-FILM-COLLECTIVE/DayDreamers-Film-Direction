[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route all API endpoints to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Backward compatibility redirect for old /booking/ routes
[[redirects]]
  from = "/booking/*"
  to = "/:splat"
  status = 301

# Backward compatibility redirect for burger-menu.css
[[redirects]]
  from = "/css/burger-menu/burger-menu.css"
  to = "/css/components/burger-menu.css"
  status = 301

# Protect internal server code, specs, playground, and sql from public web scraping
[[redirects]]
  from = "/server/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/specs/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.sql"
  to = "/404.html"
  status = 404

# Aggressive immutable caching for static fonts and assets
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
