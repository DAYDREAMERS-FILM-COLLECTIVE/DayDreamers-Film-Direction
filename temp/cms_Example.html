<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daydreamers — Admin CMS</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --bg: #08090d;
                --bg2: #11131a;
                --panel: #161922;
                --gold: #e3b94e;
                --gold-dim: rgba(227, 185, 78, 0.35);
                --cream: #f3ead8;
                --muted: #8b8778;
                --danger: #b3202c;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background-color: var(--bg);
                color: var(--cream);
                font-family: 'Inter', sans-serif;
                min-height: 100vh;
                -webkit-font-smoothing: antialiased;
            }
            h1,
            h2,
            h3 {
                font-family: 'Playfair Display', serif;
            }

            /* Layout */
            .admin-layout {
                display: grid;
                grid-template-columns: 260px 1fr;
                min-height: 100vh;
            }
            @media (max-width: 768px) {
                .admin-layout {
                    grid-template-columns: 1fr;
                }
            }

            /* Sidebar */
            .sidebar {
                background: var(--bg2);
                border-right: 1px solid rgba(227, 185, 78, 0.1);
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 2rem;
            }
            .brand {
                font-size: 1.1rem;
                font-weight: 600;
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }
            .brand span {
                color: var(--gold);
                font-style: italic;
                font-family: 'Playfair Display', serif;
            }
            .nav-links {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }
            .nav-item {
                padding: 12px 16px;
                border-radius: 8px;
                color: var(--muted);
                text-decoration: none;
                font-size: 0.9rem;
                font-weight: 500;
                transition: all 0.2s;
                cursor: pointer;
            }
            .nav-item:hover,
            .nav-item.active {
                background: rgba(227, 185, 78, 0.1);
                color: var(--gold);
            }
            .back-link {
                margin-top: auto;
                color: var(--muted);
                text-decoration: none;
                font-size: 0.85rem;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .back-link:hover {
                color: var(--cream);
            }

            /* Main Content */
            .main-content {
                padding: 3rem;
                overflow-y: auto;
            }
            @media (max-width: 768px) {
                .main-content {
                    padding: 1.5rem;
                }
            }

            .section-header {
                margin-bottom: 2rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 1rem;
            }
            .section-header h2 {
                font-size: 2rem;
            }

            .btn {
                padding: 10px 20px;
                border-radius: 8px;
                border: none;
                font-family: 'Inter', sans-serif;
                font-size: 0.85rem;
                font-weight: 600;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                cursor: pointer;
                transition: all 0.2s;
            }
            .btn-primary {
                background: var(--gold);
                color: var(--bg);
            }
            .btn-primary:hover {
                box-shadow: 0 0 20px rgba(227, 185, 78, 0.3);
            }
            .btn-danger {
                background: transparent;
                border: 1px solid var(--danger);
                color: var(--danger);
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .btn-danger:hover {
                background: var(--danger);
                color: white;
            }

            /* Cards & Tables */
            .card {
                background: var(--panel);
                border: 1px solid rgba(227, 185, 78, 0.1);
                border-radius: 12px;
                padding: 1.5rem;
                margin-bottom: 1.5rem;
            }
            .form-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 1rem;
                margin-bottom: 1rem;
            }
            .form-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .form-group label {
                font-size: 0.75rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .form-group input,
            .form-group select {
                background: var(--bg2);
                border: 1px solid rgba(227, 185, 78, 0.2);
                color: var(--cream);
                padding: 10px 14px;
                border-radius: 6px;
                font-family: 'Inter', sans-serif;
                font-size: 0.9rem;
            }
            .form-group input:focus {
                outline: none;
                border-color: var(--gold);
            }

            .data-table {
                width: 100%;
                border-collapse: collapse;
            }
            .data-table th {
                text-align: left;
                padding: 12px 16px;
                font-size: 0.75rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid rgba(227, 185, 78, 0.15);
            }
            .data-table td {
                padding: 16px;
                font-size: 0.9rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            }
            .data-table tr:last-child td {
                border-bottom: none;
            }
            .status-badge {
                display: inline-block;
                padding: 4px 10px;
                border-radius: 99px;
                font-size: 0.7rem;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                font-weight: 600;
            }
            .status-pending {
                background: rgba(227, 185, 78, 0.15);
                color: var(--gold);
            }
            .status-confirmed {
                background: rgba(46, 204, 113, 0.15);
                color: #2ecc71;
            }

            .empty-state {
                text-align: center;
                padding: 3rem;
                color: var(--muted);
                font-style: italic;
                font-family: 'Playfair Display', serif;
            }
        </style>
    </head>
    <body>
        <div class="admin-layout">
            <aside class="sidebar">
                <div class="brand">Daydreamers <span>Admin</span></div>
                <nav class="nav-links">
                    <a class="nav-item active" onclick="showSection('movies')">Manage Movies</a>
                    <a class="nav-item" onclick="showSection('applications')"
                        >Applications & Bookings</a
                    >
                </nav>
                <a href="index.html" class="back-link">← Return to Public Site</a>
            </aside>

            <main class="main-content">
                <!-- Movies Section -->
                <section id="moviesSection">
                    <div class="section-header">
                        <h2>Screening Library</h2>
                        <button
                            class="btn btn-primary"
                            onclick="
                                document.getElementById('addMovieForm').style.display = 'block'
                            "
                        >
                            Add New Film
                        </button>
                    </div>

                    <div class="card" id="addMovieForm" style="display: none">
                        <h3 style="margin-bottom: 1rem; font-size: 1.2rem">Add New Screening</h3>
                        <form onsubmit="addMovie(event)">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Film Title</label>
                                    <input
                                        type="text"
                                        id="newTitle"
                                        required
                                        placeholder="e.g. Neon Reverie"
                                    />
                                </div>
                                <div class="form-group">
                                    <label>Director</label>
                                    <input
                                        type="text"
                                        id="newDir"
                                        required
                                        placeholder="e.g. A. Moreau"
                                    />
                                </div>
                                <div class="form-group">
                                    <label>Genre</label>
                                    <input
                                        type="text"
                                        id="newGenre"
                                        required
                                        placeholder="e.g. Sci-Fi"
                                    />
                                </div>
                            </div>
                            <div style="display: flex; gap: 1rem; justify-content: flex-end">
                                <button
                                    type="button"
                                    class="btn"
                                    style="
                                        background: transparent;
                                        color: var(--muted);
                                        border: 1px solid var(--muted);
                                    "
                                    onclick="
                                        document.getElementById('addMovieForm').style.display =
                                            'none'
                                    "
                                >
                                    Cancel
                                </button>
                                <button type="submit" class="btn btn-primary">Save Film</button>
                            </div>
                        </form>
                    </div>

                    <div class="card" style="padding: 0; overflow: hidden">
                        <table class="data-table" id="moviesTable">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Director</th>
                                    <th>Genre</th>
                                    <th style="text-align: right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="moviesList"></tbody>
                        </table>
                    </div>
                </section>

                <!-- Applications Section -->
                <section id="applicationsSection" style="display: none">
                    <div class="section-header">
                        <h2>Recent Bookings</h2>
                    </div>
                    <div class="card" style="padding: 0; overflow: hidden">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Reference</th>
                                    <th>Film</th>
                                    <th>Seats</th>
                                    <th>Location</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsList"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>

        <script>
            // Mock Data
            let movies = [
                { id: 1, title: 'Neon Reverie', dir: 'A. Moreau', genre: 'Sci-Fi' },
                { id: 2, title: 'The Last Reel', dir: 'K. Tanaka', genre: 'Drama' },
                { id: 3, title: 'Silent Orbit', dir: 'E. Volkov', genre: 'Thriller' },
            ];

            const bookings = [
                {
                    ref: 'DD-X9K2',
                    film: 'Neon Reverie',
                    seats: 'C4, C5',
                    location: 'D Block 3rd Floor',
                    status: 'Confirmed',
                },
                {
                    ref: 'DD-A1M9',
                    film: 'The Last Reel',
                    seats: 'F2',
                    location: 'D Block 4th Floor',
                    status: 'Pending',
                },
                {
                    ref: 'DD-P3L4',
                    film: 'Silent Orbit',
                    seats: 'A1, A2, A3',
                    location: 'D Block 3rd Floor',
                    status: 'Confirmed',
                },
            ];

            function renderMovies() {
                const tbody = document.getElementById('moviesList');
                tbody.innerHTML = '';
                if (movies.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="4" class="empty-state">No films currently scheduled</td></tr>';
                    return;
                }
                movies.forEach((m) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td style="font-weight: 500; color: var(--cream);">${m.title}</td>
                    <td style="color: var(--muted);">${m.dir}</td>
                    <td><span class="status-badge status-pending">${m.genre}</span></td>
                    <td style="text-align: right;">
                        <button class="btn btn-danger" onclick="removeMovie(${m.id})">Remove</button>
                    </td>
                `;
                    tbody.appendChild(tr);
                });
            }

            function renderBookings() {
                const tbody = document.getElementById('bookingsList');
                tbody.innerHTML = '';
                bookings.forEach((b) => {
                    const tr = document.createElement('tr');
                    const statusClass =
                        b.status === 'Confirmed' ? 'status-confirmed' : 'status-pending';
                    tr.innerHTML = `
                    <td style="font-family: monospace; letter-spacing: 0.05em;">${b.ref}</td>
                    <td style="font-weight: 500;">${b.film}</td>
                    <td>${b.seats}</td>
                    <td style="color: var(--muted);">${b.location}</td>
                    <td><span class="status-badge ${statusClass}">${b.status}</span></td>
                `;
                    tbody.appendChild(tr);
                });
            }

            function addMovie(e) {
                e.preventDefault();
                const title = document.getElementById('newTitle').value;
                const dir = document.getElementById('newDir').value;
                const genre = document.getElementById('newGenre').value;

                movies.push({ id: Date.now(), title, dir, genre });
                renderMovies();

                document.getElementById('newTitle').value = '';
                document.getElementById('newDir').value = '';
                document.getElementById('newGenre').value = '';
                document.getElementById('addMovieForm').style.display = 'none';
            }

            function removeMovie(id) {
                if (confirm('Are you sure you want to remove this film from the schedule?')) {
                    movies = movies.filter((m) => m.id !== id);
                    renderMovies();
                }
            }

            function showSection(section) {
                document
                    .querySelectorAll('.nav-item')
                    .forEach((el) => el.classList.remove('active'));
                event.target.classList.add('active');

                if (section === 'movies') {
                    document.getElementById('moviesSection').style.display = 'block';
                    document.getElementById('applicationsSection').style.display = 'none';
                } else {
                    document.getElementById('moviesSection').style.display = 'none';
                    document.getElementById('applicationsSection').style.display = 'block';
                }
            }

            // Initialize
            renderMovies();
            renderBookings();
        </script>
    </body>
</html>
