<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daydreamers Cinema Hero Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Heebo:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #10050E;
    --font-serif: 'Instrument Serif', 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Heebo', -apple-system, sans-serif;
    --font-ui: 'Plus Jakarta Sans', -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-dark);
    color: #F5EFEB;
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }

  /* Top Demo Header Bar */
  .demo-header {
    width: 100%;
    max-width: 1440px;
    padding: 10px 32px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-ui);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #A47D93;
    text-transform: uppercase;
  }

  .demo-header .brand {
    color: #F8F4F1;
    font-weight: 700;
    letter-spacing: 0.28em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Main Cinema Hero Stage - Seamless into page */
  .cinema-hero-stage {
    position: relative;
    width: 100%;
    max-width: 1440px;
    aspect-ratio: 2184 / 729;
    overflow: visible;
    background: transparent;
  }

  /* 100% Clean Cinematic Backdrop */
  .stage-backdrop {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 1;
    pointer-events: none;
    user-select: none;
  }

  /* Content Overlay */
  .stage-content {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  /* 1. Left: Poster Card */
  .stage-poster {
    position: absolute;
    left: 11.63%;
    top: 14.95%;
    width: 15.34%;
    height: 68.59%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    background: #1A0B17;
  }

  .stage-poster:hover {
    transform: scale(1.02);
  }

  .stage-poster-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
    border: 1px solid rgba(214, 154, 185, 0.3);
    display: block;
  }

  /* 2. Center: Information Cluster */
  .stage-info {
    position: absolute;
    left: 29.85%;
    top: 25.5%;
    max-width: 32%;
    display: flex;
    flex-direction: column;
  }

  .hero-eyebrow {
    font-family: var(--font-ui);
    font-size: clamp(9px, 0.72vw, 11px);
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #A47D93;
    margin-bottom: clamp(10px, 1.4vw, 18px);
  }

  .hero-title {
    font-family: var(--font-serif);
    font-size: clamp(38px, 4.4vw, 68px);
    font-weight: 400;
    color: #F8F4F1;
    letter-spacing: -0.015em;
    line-height: 1;
    margin-bottom: clamp(10px, 1.2vw, 18px);
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
  }

  .hero-meta-row {
    font-family: var(--font-ui);
    font-size: clamp(8.5px, 0.68vw, 10.5px);
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #8E687F;
    margin-bottom: clamp(12px, 1.4vw, 20px);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hero-meta-row span.bullet {
    color: rgba(142, 104, 127, 0.5);
  }

  .hero-synopsis {
    font-family: var(--font-body);
    font-size: clamp(11.5px, 0.9vw, 14px);
    font-weight: 300;
    line-height: 1.55;
    color: #B59EAD;
    max-width: 440px;
    margin-bottom: clamp(20px, 2.5vw, 36px);
  }

  .hero-actions {
    display: flex;
    align-items: center;
    gap: clamp(16px, 2vw, 28px);
  }

  /* Sharp Rectangular Button - No Rounded Corners, No Neon Glow */
  .btn-reserve-solid {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 34px;
    border-radius: 0;
    background: #D495B1;
    color: #120410;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid #D495B1;
    cursor: pointer;
    box-shadow: none;
    transition: all 0.25s ease;
  }

  .btn-reserve-solid:hover {
    background: #E8D6E1;
    border-color: #E8D6E1;
    color: #120410;
    transform: translateY(-1px);
    box-shadow: none;
  }

  /* Sharp Secondary Button */
  .btn-venue-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 28px;
    border-radius: 0;
    background: transparent;
    border: 1px solid rgba(214, 154, 185, 0.4);
    color: #F5EFEB;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .btn-venue-link:hover {
    border-color: #D495B1;
    color: #D495B1;
    background: rgba(214, 154, 185, 0.1);
    transform: translateY(-1px);
  }

  /* 3. Far Right: High-Contrast Floating Editorial Date & Time */
  .stage-schedule {
    position: absolute;
    left: 86.77%;
    top: 38%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    user-select: none;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .stage-schedule:hover {
    opacity: 0.9;
    transform: translateX(-50%) translateY(-2px);
  }

  .sched-weekday {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #D495B1;
    line-height: 1;
    margin-bottom: 6px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  }

  .sched-day {
    font-family: var(--font-serif);
    font-size: clamp(48px, 4.4vw, 66px);
    font-weight: 400;
    line-height: 0.92;
    color: #FFFFFF;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9);
  }

  .sched-month {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #D495B1;
    line-height: 1;
    margin-top: 6px;
    margin-bottom: 14px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  }

  .sched-divider {
    width: clamp(28px, 2.5vw, 42px);
    height: 1.5px;
    background: rgba(214, 154, 185, 0.55);
    margin: 2px 0 14px;
  }

  .sched-time {
    font-family: var(--font-serif);
    font-size: clamp(22px, 1.8vw, 26px);
    font-weight: 400;
    color: #FFFFFF;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
  }

  .sched-ampm {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: #D495B1;
  }

  /* Responsive Mobile Layout */
  @media (max-width: 840px) {
    .cinema-hero-stage {
      aspect-ratio: auto;
      min-height: auto;
      border-radius: 0;
      padding: 48px 24px;
    }
    .stage-backdrop {
      object-fit: cover;
    }
    .stage-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .stage-poster {
      position: relative;
      left: auto;
      top: auto;
      width: 170px;
      height: 250px;
      margin-bottom: 28px;
    }
    .stage-info {
      position: relative;
      left: auto;
      top: auto;
      max-width: 100%;
      align-items: center;
      margin-bottom: 32px;
    }
    .hero-meta-row {
      justify-content: center;
    }
    .hero-actions {
      justify-content: center;
    }
    .stage-schedule {
      position: relative;
      left: auto;
      top: auto;
      transform: none;
    }
  }
</style>
</head>
<body>

  <header class="demo-header">
    <div class="brand">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      DAYDREAMERS
    </div>
    <div class="status">Editorial Update // Sharp Buttons & High-Contrast Schedule</div>
  </header>

  <main class="cinema-hero-stage">
    <!-- Clean Widescreen Artwork Plate -->
    <img class="stage-backdrop" src="/assets/hero-arch-bg.webp" alt="Cinematic auditorium entrance with neon arch" />

    <div class="stage-content">
      <!-- 1. Left: Movie Poster Card -->
      <div class="stage-poster">
        <img class="stage-poster-img" src="/assets/poster-the-last-reel.webp" alt="The Last Reel poster" />
      </div>

      <!-- 2. Center: Dynamic Information -->
      <div class="stage-info">
        <div class="hero-eyebrow">D BLOCK 4TH FLOOR</div>
        <h1 class="hero-title">The Last Reel</h1>
        <div class="hero-meta-row">
          <span>DRAMA</span>
          <span class="bullet">|</span>
          <span>1H 52M</span>
          <span class="bullet">|</span>
          <span>2023</span>
          <span class="bullet">|</span>
          <span>UA</span>
        </div>
        <p class="hero-synopsis">
          An aging projectionist discovers a single frame<br>
          of unreleased nitrate film tucked into an archival spool.
        </p>
        <div class="hero-actions">
          <a class="btn-reserve-solid" href="#booking">RESERVE SEATS</a>
          <a class="btn-venue-link" href="#venue">VIEW VENUE</a>
        </div>
      </div>

      <!-- 3. Right: High-Contrast Schedule Column -->
      <div class="stage-schedule">
        <span class="sched-weekday">FRI</span>
        <b class="sched-day">18</b>
        <span class="sched-month">SEP</span>
        <div class="sched-divider"></div>
        <div class="sched-time">
          7:30 <span class="sched-ampm">PM</span>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
